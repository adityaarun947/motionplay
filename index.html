<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MotionPlay</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0b0e1f; color:#f3f5ff; font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding:16px; box-sizing:border-box; }
  main { max-width:900px; width:100%; text-align:center; }
  h1 { font-size:clamp(32px,6vw,64px); margin:0 0 8px; letter-spacing:-0.02em; }
  p { color:#a7b0d8; font-size:clamp(16px,2vw,22px); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:20px; margin-top:28px; }
  a { display:block; padding:32px 24px; border-radius:24px; background:#171b3d; color:#fff; text-decoration:none; border:3px solid transparent; }
  a:hover, a:focus { border-color:#5b8cff; outline:none; }
  a b { display:block; font-size:clamp(22px,3vw,34px); margin-bottom:6px; }
  a span { color:#a7b0d8; }
</style>
</head>
<body>
<main>
  <h1>MotionPlay</h1>
  <p>Your body is the controller. Open the TV screen on the big screen, and the tracker on the tablet.</p>
  <div class="grid">
    <a href="tv.html"><b>📺 This is the TV</b><span>Shows the games and a pairing code</span></a>
    <a href="tracker.html"><b>📷 This is the tablet</b><span>Watches you move and sends it to the TV</span></a>
  </div>
</main>
</body>
</html>
