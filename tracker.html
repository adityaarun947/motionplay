<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MotionPlay Tracker</title>
<style>
  :root { --bg:#0d1020; --panel:#171b33; --ink:#eef1ff; --mut:#9aa3c7; --ok:#3ee08f; --warn:#ffc24a; --err:#ff5d6c; --acc:#5b8cff; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display:flex; flex-direction:column; gap:10px; padding:12px 16px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  h1 { font-size:20px; margin:0; letter-spacing:-0.01em; }
  #status { padding:6px 12px; border-radius:999px; background:var(--panel); font-size:14px; }
  #status.ok { color:var(--ok); } #status.warn { color:var(--warn); } #status.err { color:var(--err); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input[type=text], input:not([type]) { font-size:22px; width:120px; padding:8px 12px; border-radius:10px; border:1px solid #2c3361; background:#0f1430; color:var(--ink); letter-spacing:0.2em; text-align:center; }
  button { font-size:16px; padding:10px 16px; border-radius:10px; border:0; background:var(--panel); color:var(--ink); cursor:pointer; }
  button.primary { background:var(--acc); color:#fff; font-weight:600; }
  button:disabled { opacity:0.4; }
  label.chk { display:flex; gap:6px; align-items:center; color:var(--mut); font-size:14px; }
  #stage { position:relative; flex:1; min-height:200px; background:#000; border-radius:14px; overflow:hidden; }
  #stage.saver video, #stage.saver canvas { visibility:hidden; }
  #video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; transform:scaleX(-1); opacity:0.55; }
  #overlay { position:absolute; inset:0; width:100%; height:100%; }
  #hint { position:absolute; left:12px; right:12px; bottom:12px; text-align:center; font-size:18px; font-weight:600; text-shadow:0 2px 6px #000; }
  #stats { color:var(--mut); font-size:13px; display:flex; gap:16px; flex-wrap:wrap; }
  #stats b { color:var(--ink); font-weight:600; }
  .pill { padding:2px 8px; border-radius:6px; background:var(--panel); }
  .pill.on { background:var(--acc); color:#fff; }
</style>
</head>
<body>
<header>
  <h1>MotionPlay · Tablet tracker</h1>
  <div id="status">Not started</div>
</header>

<div class="row">
  <input id="code" inputmode="numeric" maxlength="4" placeholder="TV code" aria-label="TV code">
  <button id="startBtn" class="primary">Start &amp; connect</button>
  <label class="chk"><input type="checkbox" id="accurate"> Accurate mode (slower)</label>
  <label class="chk"><input type="checkbox" id="saver"> Hide preview (faster)</label>
  <label class="chk"><input type="checkbox" id="precise"> Precise hands (better aim, slower)</label>
</div>

<div id="stage">
  <video id="video" playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div id="hint">Put the tablet below the TV, step back 2–3 m, and fit your whole body in view.</div>
</div>

<div class="row">
  <button data-go="menu">Menu</button>
  <button data-go="fruit">Fruit Slash</button>
  <button data-go="runner">Lane Runner</button>
  <button data-go="zombie">Zombie Siege</button>
  <button data-go="fithub">Fit Zone</button>
  <button data-go="shape">Shape Fit</button>
  <button data-go="penguin">Penguin Slide</button>
  <button data-go="locker">Customize</button>
  <button data-go="shop">Coin shop</button>
  <button id="musicBtn">♪ Music</button>
  <button id="calBtn">Recalibrate</button>
</div>

<div id="stats">
  <span>Tracking <b id="fps">0</b> fps</span>
  <span>Delay <b id="lat">–</b></span>
  <span>Lane <span class="pill" id="sLane">mid</span></span>
  <span><span class="pill" id="sJump">jump</span> <span class="pill" id="sDuck">duck</span> <span class="pill" id="sUp">hands up</span></span>
  <span id="calState">Not calibrated</span>
  <span id="note"></span>
</div>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script type="module">
import { FilesetResolver, PoseLandmarker, HandLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';

/* ============================================================
   CONFIG — tune these if gestures feel too sensitive / too dull
   ============================================================ */
const CFG = {
  peerPrefix: 'motionplay-v1-',
  wasm: 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm',
  modelLite: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
  modelFull: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task',
  maxSendHz: 45,            // send every tracked frame, up to this rate
  // Lane: sideways hip shift, in shoulder-widths from your calibrated centre
  laneOn: 0.5, laneOff: 0.28,
  // Jump: shoulders AND hips rise (fraction of torso length), or a fast upward push
  jumpOn: 0.10, jumpOff: 0.05, jumpVel: 0.9,
  // Duck: shoulders drop (fraction of torso length)
  duckOn: 0.22, duckOff: 0.12,
  // Hand cursor box, in shoulder-widths around your shoulders (smaller = less arm travel)
  reachX: 4.4, reachTop: 2.1, reachH: 4.0,
  handReach: 0.6,           // cursor point: 0 = wrist, 1 = index knuckle
  handHoldMs: 160,          // keep a hand alive this long when motion blur hides it
  // One Euro filters: higher beta = snappier when moving fast, higher minCutoff = less smoothing when still
  bodyFilter: { minCutoff: 1.0, beta: 4.0, dCutoff: 1.0 },
  handFilter: { minCutoff: 1.7, beta: 5.0, dCutoff: 1.0 },
  drift: 0.004,             // how fast your calibrated centre follows you while you stand still
  calDelayMs: 1300, calDurMs: 1000,
  // Precise hands: an extra hand-finger model that makes aiming much steadier (costs some fps)
  handModel: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
  handEvery: 2,             // run it on every 2nd camera frame
  handMatch: 0.3,           // a detected hand must be this close (in body-heights) to a pose wrist
  handFresh: 170,           // ms a precise reading stays valid
};
window.MP = { CFG };        // handy for tuning from the browser console

const P = { NOSE:0, LSH:11, RSH:12, LEL:13, REL:14, LWR:15, RWR:16, LIDX:19, RIDX:20, LHIP:23, RHIP:24 };
const BONES = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28],[15,19],[16,20]];

const $ = s => document.querySelector(s);
const video = $('#video'), overlay = $('#overlay'), octx = overlay.getContext('2d');

/* ---------------- One Euro filter: smooth when still, near-zero lag when moving fast ---------------- */
const alphaFor = (cutoff, dt) => 1 / (1 + 1 / (2 * Math.PI * cutoff * dt));
class OneEuro {
  constructor(p){ this.p = p; this.reset(); }
  reset(){ this.x = null; this.dx = 0; this.v = 0; }
  filter(x, dt){
    if (this.x === null) { this.x = x; this.dx = 0; this.v = 0; return x; }
    const d = (x - this.x) / dt;
    this.dx += alphaFor(this.p.dCutoff, dt) * (d - this.dx);
    this.v = this.dx;
    const cutoff = this.p.minCutoff + this.p.beta * Math.abs(this.dx);
    this.x += alphaFor(cutoff, dt) * (x - this.x);
    return this.x;
  }
}

const S = {
  landmarker:null, running:false, lastVideoTime:-1, lastT:0,
  peer:null, conn:null, code:'', retryTimer:null,
  frames:0, lastStat:performance.now(), lastSend:0, wake:null, saver:false,
  precise:false, handLm:null, handLoading:false, frameNo:0,
  fb:false, players:1,
};
// Everything that belongs to ONE person (so two players can be tracked at once)
function makePlayer(){
  return {
    bodyF: Array.from({ length:33 }, () => [new OneEuro(CFG.bodyFilter), new OneEuro(CFG.bodyFilter)]),
    sm:null, base:null, calib:null,
    hands:[0, 1].map(() => ({ fx:new OneEuro(CFG.handFilter), fy:new OneEuro(CFG.handFilter), x:0.5, y:0.5, v:0, seen:-1e9 })),
    g:{ lane:0, jump:false, duck:false, up:false }, jumpAt:0, jumpEnd:0,
    present:false, presentSince:0, lostAt:0, warn:'',
    hp:[{ X:0, Y:0, t:-1e9 }, { X:0, Y:0, t:-1e9 }], prevKey:null, mv:0,
    size:null,        // how wide your shoulders look right now — keeps the on-screen figure the same size wherever you stand
    lastX:null,
  };
}
const PL = [makePlayer(), makePlayer()];
let Q = PL[0];        // the player being processed right now

const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const r3 = v => Math.round(v*1000)/1000;
const mid = (a,b) => ({ X:(a.X+b.X)/2, Y:(a.Y+b.Y)/2, v:Math.min(a.v,b.v) });
const dist = (a,b) => Math.hypot(a.X-b.X, a.Y-b.Y);
function setStatus(text, cls=''){ const el=$('#status'); el.textContent=text; el.className=cls; }
let lastHint = '';
function setHint(t){ if (t !== lastHint) { $('#hint').textContent = t; lastHint = t; } }

/* ---------------- start-up ---------------- */
try {
  const qs = new URLSearchParams(location.search).get('code');
  $('#code').value = qs || localStorage.getItem('mp-code') || '';
  $('#saver').checked = localStorage.getItem('mp-saver') === '1';
} catch {}
S.saver = $('#saver').checked; $('#stage').classList.toggle('saver', S.saver);
$('#saver').addEventListener('change', e => { S.saver = e.target.checked; $('#stage').classList.toggle('saver', S.saver); try { localStorage.setItem('mp-saver', S.saver ? '1' : '0'); } catch {} });

$('#startBtn').addEventListener('click', start);
$('#calBtn').addEventListener('click', () => startCalibration());
document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => send({ t:'cmd', go:b.dataset.go })));
$('#musicBtn').addEventListener('click', () => send({ t:'cmd', music:'toggle' }));
function note(t){ $('#note').textContent = t; }
try { $('#precise').checked = localStorage.getItem('mp-precise') === '1'; } catch {}
$('#precise').addEventListener('change', e => { try { localStorage.setItem('mp-precise', e.target.checked ? '1' : '0'); } catch {} setPrecise(e.target.checked); });

// Optional extra model that tracks the fingers directly. Fails safe: if it can't load, normal tracking carries on.
async function setPrecise(on){
  S.precise = on;
  if (!on) { note(''); return; }
  if (S.handLm || S.handLoading || !S.running) { if (S.handLm) note('Precise hands on'); return; }
  S.handLoading = true; note('Loading precise hand model…');
  try {
    const fileset = await FilesetResolver.forVisionTasks(CFG.wasm);
    const make = delegate => HandLandmarker.createFromOptions(fileset, {
      baseOptions:{ modelAssetPath: CFG.handModel, delegate }, runningMode:'VIDEO', numHands:2,
      minHandDetectionConfidence:0.4, minHandPresenceConfidence:0.4, minTrackingConfidence:0.4 });
    try { S.handLm = await make('GPU'); } catch (e) { console.warn('hand GPU failed', e); S.handLm = await make('CPU'); }
    note('Precise hands on');
  } catch (e) {
    console.warn(e); S.precise = false; $('#precise').checked = false;
    note('Precise hand model could not load — using standard tracking');
  }
  S.handLoading = false;
}

async function start(){
  const code = $('#code').value.trim();
  try { localStorage.setItem('mp-code', code); } catch {}
  $('#startBtn').disabled = true;
  try {
    if (!S.running) {
      setStatus('Starting camera…');
      await startCamera();
      setStatus('Loading motion model…');
      S.landmarker = await createLandmarker($('#accurate').checked, S.players); S.lmPlayers = S.players;
      S.running = true;
      keepAwake();
      scheduleNext();
      if ($('#precise').checked) setPrecise(true);
    }
    if (/^\d{4}$/.test(code)) connect(code);
    else setStatus('Tracking (enter the 4-digit TV code to connect)', 'warn');
  } catch (e) {
    console.error(e);
    setStatus('Error: ' + (e.message || e), 'err');
  } finally {
    $('#startBtn').disabled = false;
    $('#startBtn').textContent = 'Reconnect';
  }
}

async function startCamera(){
  if (!navigator.mediaDevices?.getUserMedia) throw new Error('Camera needs HTTPS. Open this page from your https:// link.');
  const stream = await navigator.mediaDevices.getUserMedia({
    audio:false,
    video:{ facingMode:'user', width:{ ideal:640 }, height:{ ideal:480 }, frameRate:{ ideal:30, max:30 } }
  });
  video.srcObject = stream;
  await video.play();
}

async function createLandmarker(accurate, n = 1){
  const fileset = await FilesetResolver.forVisionTasks(CFG.wasm);
  const opts = delegate => ({
    baseOptions:{ modelAssetPath: accurate ? CFG.modelFull : CFG.modelLite, delegate },
    runningMode:'VIDEO', numPoses:n,
    minPoseDetectionConfidence: n > 1 ? 0.35 : 0.5, minPosePresenceConfidence: n > 1 ? 0.35 : 0.5, minTrackingConfidence: n > 1 ? 0.4 : 0.5,
  });
  try { return await PoseLandmarker.createFromOptions(fileset, opts('GPU')); }
  catch (e) { console.warn('GPU delegate failed, using CPU', e); return await PoseLandmarker.createFromOptions(fileset, opts('CPU')); }
}

async function keepAwake(){ try { S.wake = await navigator.wakeLock?.request('screen'); } catch {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.running) keepAwake(); });

/* ---------------- connection to the TV (WebRTC via PeerJS) ---------------- */
function connect(code){
  clearTimeout(S.retryTimer);
  S.code = code;
  if (S.conn) { try { S.conn.close(); } catch {} S.conn = null; }
  if (S.peer && !S.peer.destroyed) { if (S.peer.open) dial(); return; }
  setStatus('Connecting to TV ' + code + '…', 'warn');
  const peer = new Peer(undefined, { debug:1 });
  S.peer = peer;
  peer.on('open', dial);
  peer.on('disconnected', () => { try { peer.reconnect(); } catch {} });
  peer.on('error', err => {
    console.warn('peer error', err.type, err);
    if (err.type === 'peer-unavailable') setStatus('No TV found with code ' + S.code + ' — check the number on the TV', 'err');
    else setStatus('Connection problem (' + err.type + ') — retrying…', 'err');
    scheduleRetry();
  });
}

function dial(){
  const conn = S.peer.connect(CFG.peerPrefix + S.code, { reliable:false, serialization:'json' });
  conn.on('open', () => {
    S.conn = conn;
    setStatus('Connected to TV ' + S.code, 'ok');
    send({ t:'hello', role:'tracker', calibrated: !!Q.base });
  });
  conn.on('data', onTvMessage);
  conn.on('close', () => { if (S.conn === conn) { S.conn = null; setPlayers(1); setStatus('TV disconnected — retrying…', 'warn'); scheduleRetry(); } });
  conn.on('error', e => console.warn('conn error', e));
}

function scheduleRetry(){
  clearTimeout(S.retryTimer);
  S.retryTimer = setTimeout(() => { if (!S.conn && S.code) { if (S.peer?.open) dial(); else connect(S.code); } }, 3000);
}

function send(msg){ if (S.conn && S.conn.open) { try { S.conn.send(msg); } catch {} } }

function onTvMessage(msg){
  if (!msg || typeof msg !== 'object') return;
  if (msg.t === 'calibrate') startCalibration();
  if (msg.t === 'scene') { sceneHint = msg.text || ''; for (const p of PL) p.size = null; }   // re-measure your size at the start of every game
  if (msg.t === 'mode') { if ('fb' in msg) S.fb = !!msg.fb; if ('players' in msg) setPlayers(msg.players | 0); }   // the TV asks for the full-body skeleton / a second player only when it needs it
  if (msg.t === 'pong') { const rtt = performance.now() - msg.ts; $('#lat').textContent = Math.round(rtt / 2 + 1000 / 30) + ' ms'; }
}
let sceneHint = '';
setInterval(() => send({ t:'ping', ts: performance.now() }), 2000);

/* ---------------- main tracking loop ---------------- */
// requestVideoFrameCallback runs exactly once per new camera frame (lower delay, less wasted work)
const hasRVFC = 'requestVideoFrameCallback' in HTMLVideoElement.prototype;
function scheduleNext(){ if (hasRVFC) video.requestVideoFrameCallback(() => tick()); else requestAnimationFrame(tick); }

function tick(){
  if (!S.running) return;
  scheduleNext();
  if (!S.landmarker) return;   // being rebuilt for 1 / 2 players
  if (video.readyState < 2 || video.currentTime === S.lastVideoTime) return;
  S.lastVideoTime = video.currentTime;

  const now = performance.now();
  const dt = clamp((now - (S.lastT || now - 33)) / 1000, 0.005, 0.2);
  S.lastT = now;
  let res;
  try { res = S.landmarker.detectForVideo(video, now); } catch (e) { console.warn(e); return; }
  S.frames++; S.frameNo++;

  const aspect = (video.videoWidth || 4) / (video.videoHeight || 3);
  S.seen = (res?.landmarks || []).length;
  const poses = (res?.landmarks || []).slice(0, S.players);
  const who = assignPoses(poses);
  const outs = [];
  for (let i = 0; i < S.players; i++) { Q = PL[i]; outs.push(processPose(who[i], dt, now, aspect)); }
  Q = PL[0];
  finish(now, outs, aspect);
}

// With two players: the person on the left of the picture (as shown on the TV) is player 1.
// With one person in view, they stay with whichever player they were nearest to last time.
function assignPoses(poses){
  const out = Array(S.players).fill(null);
  if (!poses.length) return out;
  const cx = lm => [11, 12, 23, 24].reduce((a, i) => a + (1 - lm[i].x), 0) / 4;
  const xs = poses.map(cx);
  if (S.players === 1) { out[0] = poses[0]; PL[0].lastX = xs[0]; return out; }
  if (poses.length >= 2) {
    const o = [0, 1].sort((a, b) => xs[a] - xs[b]);
    out[0] = poses[o[0]]; out[1] = poses[o[1]]; PL[0].lastX = xs[o[0]]; PL[1].lastX = xs[o[1]];
    return out;
  }
  const x = xs[0], d0 = Math.abs(x - (PL[0].lastX ?? 0.33)), d1 = Math.abs(x - (PL[1].lastX ?? 0.67)), k = d0 <= d1 ? 0 : 1;
  out[k] = poses[0]; PL[k].lastX = x;
  return out;
}

// Switching between 1 and 2 people: build a fresh model with the right numPoses (more reliable than changing it live)
async function rebuildLandmarker(){
  if (!S.running) return;                                  // not started yet: start() builds it with S.players
  if (S.rebuilding) { S.rebuildAgain = true; return; }
  S.rebuilding = true;
  try {
    do {
      S.rebuildAgain = false;
      const want = S.players, old = S.landmarker;
      S.landmarker = null;                                  // pause tracking for a moment; close the old model FIRST so the tablet's GPU is free for the new one
      try { old && old.close(); } catch {}
      await new Promise(r => setTimeout(r, 150));
      S.landmarker = await createLandmarker($('#accurate').checked, want); S.lmPlayers = want;
      note(want > 1 ? 'Two-player model ready' : 'One-player model ready');
    } while (S.rebuildAgain || S.lmPlayers !== S.players);
  } catch (e) { console.warn('rebuild', e); note('Could not switch player mode'); }
  S.rebuilding = false;
}
function setPlayers(n){
  n = n === 2 ? 2 : 1;
  if (n === S.players) { if (S.running && S.lmPlayers !== n && !S.rebuilding) rebuildLandmarker(); return; }   // (also retries a switch that failed)
  S.players = n;
  rebuildLandmarker();
  for (const p of PL) { p.lastX = null; p.present = false; p.size = null; for (const f of p.bodyF) { f[0].reset(); f[1].reset(); } }
  if (S.precise && n === 2) note('Two-player mode: precise hands paused');
  else if (S.precise) note('Precise hands on');
}

// One person's whole pipeline: filter → calibrate → gestures → hands → exercise numbers.  Returns {sm, data} (data = null if not seen).
function processPose(lm, dt, now, aspect){
  if (!lm) { noPerson(now); return { sm:null, data:null }; }

  // 1) Mirror (moving right = right on TV) and convert to "height units" so X and Y share a scale
  const raw = lm.map(p => ({ X:(1 - p.x) * aspect, Y:p.y, v: p.visibility ?? 1 }));

  // 2) Filter the body. If you were gone for a while, restart the filters so nothing slides in from the old spot.
  if (now - Q.lostAt < 1e9 && !Q.present && now - Q.lostAt > 500) for (const f of Q.bodyF) { f[0].reset(); f[1].reset(); }
  const sm = raw.map((p, i) => ({ X: Q.bodyF[i][0].filter(p.X, dt), Y: Q.bodyF[i][1].filter(p.Y, dt), v: p.v }));
  Q.sm = sm;

  const body = measure(sm);
  body.shVy = (Q.bodyF[P.LSH][1].v + Q.bodyF[P.RSH][1].v) / 2;   // + = moving down
  if (body.sh.v < 0.5) { noPerson(now); return { sm, data:null }; }
  if (!Q.present) { Q.present = true; Q.presentSince = now; }

  // 2b) Keep the on-screen figure a constant size: follow how wide your shoulders look to the camera.
  // (Grows quickly, shrinks slowly — so turning sideways for a moment doesn't shrink you.)
  if (!Q.size) Q.size = body.shW;
  else Q.size += (body.shW - Q.size) * (1 - Math.exp(-dt / (body.shW > Q.size ? 0.15 : 1.5)));

  // 3) Calibration (auto on first sight, or when the TV/you ask)
  if (!Q.base && !Q.calib && now - Q.presentSince > 1500) startCal(Q);
  if (Q.calib) runCalibration(now, body);

  // 4) Gestures
  detectGestures(body, sm, now);

  // 4b) Optional precise finger model (one player only); readings are matched to the nearest pose wrist
  if (S.precise && S.players === 1 && S.handLm && S.frameNo % CFG.handEvery === 0) preciseHands(raw, now, aspect);

  // 5) Hands → TV screen (0..1). Raw landmarks + a fast hand filter = less lag than filtering twice.
  const handsOut = [
    trackHand(0, raw[P.LWR], raw[P.LIDX], raw[P.LEL], body, dt, now),
    trackHand(1, raw[P.RWR], raw[P.RIDX], raw[P.REL], body, dt, now),
  ];
  const h = [];
  for (const o of handsOut) h.push(r3(clamp(o.x, -0.05, 1.05)), r3(clamp(o.y, -0.05, 1.05)), Math.round(o.v * 100) / 100);
  const sk = [];
  for (const p of sm) { const q = screenMap(p, body); sk.push(r3(q.x), r3(q.y), Math.round(p.v * 100) / 100); }

  // 6) Exercise measurements (body-relative, in torso lengths) and, on request, the full-body skeleton
  const ex = exFeatures(sm, body, dt);
  let fb = null;
  if (S.fb) {
    fb = [];
    const T = Q.base ? Q.base.torso : body.torso;
    for (const i of FBJ) { const p = sm[i]; fb.push(r2((p.X - body.hip.X) / T), r2((p.Y - body.hip.Y) / T), r2(p.v)); }
  }

  Q.warn = body.hip.v < 0.4 ? 'Step back — I can’t see your hips' : '';
  if (Q === PL[0]) setHint(Q.warn || (Q.calib ? 'Hold still in the middle…' : sceneHint));
  return { sm, data:{ h, sk, ex, fb }, handsOut };
}

const r2 = v => Math.round(v * 100) / 100;
const FBJ = [0, 11, 12, 13, 14, 15, 16, 23, 24, 25, 26, 27, 28];   // nose, shoulders, elbows, wrists, hips, knees, ankles

// Everything the TV's exercise game needs, as 15 small numbers (see EX in tv.html):
// 0-3 wrists relative to shoulders · 4-5 knee rise · 6-7 ankle rise · 8 feet apart (1 = together) · 9 lean
// 10 sideways hip shift · 11 shoulder drop · 12 movement energy · 13 legs visible · 14 arms visible
function exFeatures(sm, body, dt){
  const B = Q.base, T = B ? B.torso : body.torso, sh = body.sh, hip = body.hip;
  const q = i => sm[i];
  const ok = (i, v = 0.4) => sm[i].v > v;
  const wl = [(q(15).X - sh.X) / T, (q(15).Y - sh.Y) / T], wr = [(q(16).X - sh.X) / T, (q(16).Y - sh.Y) / T];
  const kneeL = (q(25).Y - hip.Y) / T, kneeR = (q(26).Y - hip.Y) / T, ankL = (q(27).Y - hip.Y) / T, ankR = (q(28).Y - hip.Y) / T;
  const legsOk = B && B.legs;
  const kuL = legsOk ? B.kneeL - kneeL : 0, kuR = legsOk ? B.kneeR - kneeR : 0;
  const auL = legsOk ? B.ankL - ankL : 0, auR = legsOk ? B.ankR - ankR : 0;
  const sep = Math.abs(q(28).X - q(27).X) / T, sepRatio = legsOk && B.sep > 0.15 ? sep / B.sep : 1;
  const lean = (sh.X - hip.X) / T;
  const x = hip.v > 0.4 ? hip.X : sh.X;
  const hdx = B ? (x - B.hipX) / B.shW : 0;
  const drop = B ? (sh.Y - B.shY) / B.torso : 0;
  // movement energy: how fast the main joints are moving, averaged and smoothed
  const KEY = [11, 12, 13, 14, 15, 16, 23, 24, 25, 26];
  let e = 0, n = 0;
  if (Q.prevKey) for (let j = 0; j < KEY.length; j++) {
    const p = sm[KEY[j]], o = Q.prevKey[j];
    if (p.v > 0.4) { e += Math.hypot(p.X - o[0], p.Y - o[1]) / dt / T; n++; }
  }
  Q.prevKey = KEY.map(i => [sm[i].X, sm[i].Y]);
  if (n) Q.mv += (e / n - Q.mv) * 0.3;
  const legs = (sm[25].v + sm[26].v + sm[27].v + sm[28].v) / 4;
  const arms = (sm[13].v + sm[14].v + sm[15].v + sm[16].v) / 4;
  return [r2(wl[0]), r2(wl[1]), r2(wr[0]), r2(wr[1]), r2(kuL), r2(kuR), r2(auL), r2(auR), r2(sepRatio), r2(lean), r2(hdx), r2(drop), r2(Q.mv), r2(legs), r2(arms)];
}

// Run the finger model and give each hand to the nearest pose wrist
function preciseHands(raw, now, aspect){
  let res;
  try { res = S.handLm.detectForVideo(video, now); } catch (e) { return; }
  const hands = (res?.landmarks || []).map(h => {
    const tip = h[8], knuckle = h[5], w = h[0];
    return { pt:{ X:(1 - (tip.x * 0.75 + knuckle.x * 0.25)) * aspect, Y: tip.y * 0.75 + knuckle.y * 0.25 }, wr:{ X:(1 - w.x) * aspect, Y:w.y } };
  });
  const pairs = [];
  hands.forEach((h, i) => [P.LWR, P.RWR].forEach((idx, k) => { const d = Math.hypot(raw[idx].X - h.wr.X, raw[idx].Y - h.wr.Y); if (d < CFG.handMatch) pairs.push({ d, i, k }); }));
  pairs.sort((a, b) => a.d - b.d);
  const usedH = new Set(), usedK = new Set();
  for (const p of pairs) {
    if (usedH.has(p.i) || usedK.has(p.k)) continue;
    usedH.add(p.i); usedK.add(p.k);
    Q.hp[p.k] = { X:hands[p.i].pt.X, Y:hands[p.i].pt.Y, t:now };
  }
}

function trackHand(k, wr, ix, el, body, dt, now){
  const H = Q.hands[k];
  const pr = Q.hp[k], precise = S.precise && S.players === 1 && now - pr.t < CFG.handFresh;
  const vis = precise ? 0.95 : Math.max(wr.v, ix.v * 0.9);
  if (vis > 0.2) {
    let X = wr.X, Y = wr.Y;
    if (precise) { X = pr.X; Y = pr.Y; }
    else if (ix.v > 0.25 && wr.v > 0.2) { X += (ix.X - wr.X) * CFG.handReach; Y += (ix.Y - wr.Y) * CFG.handReach; }
    else if (el.v > 0.2) { X += (wr.X - el.X) * 0.15; Y += (wr.Y - el.Y) * 0.15; }
    if (now - H.seen > CFG.handHoldMs) { H.fx.reset(); H.fy.reset(); }
    const s = screenMap({ X, Y }, body);
    H.x = H.fx.filter(s.x, dt); H.y = H.fy.filter(s.y, dt); H.v = vis; H.seen = now;
    return { x:H.x, y:H.y, v:vis };
  }
  // Fast swipes blur the hand and the camera briefly loses it — coast along the last direction
  const age = (now - H.seen) / 1000;
  if (age * 1000 < CFG.handHoldMs) return { x: H.x + H.fx.v * age, y: H.y + H.fy.v * age, v: 0.25 };
  return { x:H.x, y:H.y, v:vis };
}

function finish(now, outs, aspect){
  if (!S.saver) drawOverlay(outs, aspect);
  maybeSend(now, outs);
  stats(now);
}

function measure(sm){
  const sh = mid(sm[P.LSH], sm[P.RSH]);
  const hip = mid(sm[P.LHIP], sm[P.RHIP]);
  const shW = Math.max(0.02, dist(sm[P.LSH], sm[P.RSH]));
  const torso = hip.v > 0.4 ? Math.max(0.05, dist(sh, hip)) : shW * 1.35;
  return { sh, hip, shW, torso, nose: sm[P.NOSE],
    kneeL:(sm[25].Y - hip.Y) / torso, kneeR:(sm[26].Y - hip.Y) / torso, ankL:(sm[27].Y - hip.Y) / torso, ankR:(sm[28].Y - hip.Y) / torso,
    sep:Math.abs(sm[28].X - sm[27].X) / torso, lv:Math.min(sm[25].v, sm[26].v, sm[27].v, sm[28].v) };
}

function screenMap(p, body){
  // Body-relative mapping: the cursor box follows you, so you don't have to stand in one exact spot.
  const w = Q.size || (Q.base ? Q.base.shW : body.shW);
  return {
    x: 0.5 + (p.X - body.sh.X) / (w * CFG.reachX),
    y: (p.Y - (body.sh.Y - w * CFG.reachTop)) / (w * CFG.reachH),
  };
}

function noPerson(now){
  if (Q.present) Q.lostAt = now;
  Q.present = false; Q.size = null;
  Q.g.jump = Q.g.duck = Q.g.up = false;
  if (Q === PL[0]) setHint('I can’t see you — step into view');
}

/* ---------------- calibration ---------------- */
function startCal(q){ q.calib = { start: performance.now(), samples: [] }; q.size = null; calText(); }
function startCalibration(){ for (let i = 0; i < S.players; i++) startCal(PL[i]); }
function calText(msg){
  const c = PL.slice(0, S.players);
  $('#calState').textContent = msg || (c.some(p => p.calib) ? 'Calibrating — stand still in the middle' : c.every(p => p.base) ? 'Calibrated ✓' : 'Not calibrated');
}

function runCalibration(now, body){
  const c = Q.calib, t = now - c.start;
  if (t < CFG.calDelayMs) return;
  if (t < CFG.calDelayMs + CFG.calDurMs) { c.samples.push(body); return; }
  if (c.samples.length < 8) {
    if (t > 6000) { Q.calib = null; calText('Calibration failed — tap Recalibrate'); }
    return;
  }
  const avg = k => c.samples.reduce((s, b) => s + k(b), 0) / c.samples.length;
  Q.base = {
    hipX: avg(b => b.hip.v > 0.4 ? b.hip.X : b.sh.X),
    shY:  avg(b => b.sh.Y),
    hipY: avg(b => b.hip.Y),
    shW:  avg(b => b.shW),
    torso:avg(b => b.torso),
    legs: avg(b => b.lv) > 0.45,          // knees and feet were in view → leg exercises can be detected
    kneeL:avg(b => b.kneeL), kneeR:avg(b => b.kneeR), ankL:avg(b => b.ankL), ankR:avg(b => b.ankR), sep:avg(b => b.sep),
  };
  Q.calib = null;
  Q.g.lane = 0;
  calText();
  if (Q === PL[0]) send({ t:'calibrated' });
}

/* ---------------- gesture detection (hysteresis so states don't flicker) ---------------- */
function detectGestures(body, sm, now){
  const g = Q.g;
  // Hands up = both wrists clearly above the top of your head (so aiming high doesn't trigger it)
  const top = body.nose.Y - body.shW * 0.6;
  g.up = sm[P.LWR].Y < top && sm[P.RWR].Y < top && sm[P.LWR].v > 0.4 && sm[P.RWR].v > 0.4;
  if (!Q.base || Q.calib) return;
  const B = Q.base;

  // Lane: where your hips are vs. your calibrated centre
  const x = body.hip.v > 0.4 ? body.hip.X : body.sh.X;
  const dx = (x - B.hipX) / B.shW;
  if (g.lane === 0) { if (dx > CFG.laneOn) g.lane = 1; else if (dx < -CFG.laneOn) g.lane = -1; }
  else if (g.lane === 1)  { if (dx < CFG.laneOff) g.lane = dx < -CFG.laneOn ? -1 : 0; }
  else if (g.lane === -1) { if (dx > -CFG.laneOff) g.lane = dx > CFG.laneOn ? 1 : 0; }

  // Jump / duck: vertical movement relative to torso length. A fast upward push triggers the jump early.
  const shUp = (B.shY - body.sh.Y) / B.torso;
  const hipUp = body.hip.v > 0.4 ? (B.hipY - body.hip.Y) / B.torso : shUp;
  const upVel = -body.shVy / B.torso;
  const wasJump = g.jump;
  if (!g.jump && ((shUp > CFG.jumpOn && hipUp > CFG.jumpOn * 0.6) ||
                  (upVel > CFG.jumpVel && shUp > CFG.jumpOn * 0.45 && hipUp > CFG.jumpOn * 0.3))) { g.jump = true; Q.jumpAt = now; }
  else if (g.jump && shUp < CFG.jumpOff && now - Q.jumpAt > 120) g.jump = false;
  if (wasJump && !g.jump) Q.jumpEnd = now;
  if (!g.duck && -shUp > CFG.duckOn && now - Q.jumpEnd > 250) g.duck = true;
  else if (g.duck && -shUp < CFG.duckOff) g.duck = false;

  // Drift correction: while you stand still in the middle, slowly re-centre on you
  if (g.lane === 0 && !g.jump && !g.duck && Math.abs(dx) < CFG.laneOff * 0.8 && Math.abs(shUp) < CFG.jumpOff) {
    const a = CFG.drift;
    B.hipX += (x - B.hipX) * a; B.shY += (body.sh.Y - B.shY) * a;
    if (body.hip.v > 0.4) B.hipY += (body.hip.Y - B.hipY) * a;
    B.shW += (body.shW - B.shW) * a * 0.5; B.torso += (body.torso - B.torso) * a * 0.5;
  }
}

/* ---------------- sending ---------------- */
function pack(q, d){
  const o = { present: !!d, warn: q.warn, g: { lane:q.g.lane, jump:q.g.jump, duck:q.g.duck, up:q.g.up, cal: !!q.base } };
  if (d) { o.h = d.h; o.sk = d.sk; o.ex = d.ex; if (d.fb) o.fb = d.fb; }
  return o;
}
function maybeSend(now, outs){
  if (now - S.lastSend < 1000 / CFG.maxSendHz) return;
  S.lastSend = now;
  const msg = Object.assign({ t:'f', ts: Math.round(now * 10) / 10, seen: S.seen | 0, np: S.lmPlayers || 1 }, pack(PL[0], outs[0].data));
  if (S.players > 1) msg.p2 = pack(PL[1], outs[1] && outs[1].data);
  send(msg);
}

/* ---------------- tablet preview ---------------- */
const PCOL = ['#5b8cff', '#ff9a3f'];
function drawOverlay(outs, aspect){
  const W = overlay.clientWidth, H = overlay.clientHeight;
  if (overlay.width !== W) overlay.width = W;
  if (overlay.height !== H) overlay.height = H;
  octx.clearRect(0, 0, W, H);
  let vw = W, vh = W / aspect; if (vh > H) { vh = H; vw = H * aspect; }
  const ox = (W - vw) / 2, oy = (H - vh) / 2;
  const px = p => [ox + (p.X / aspect) * vw, oy + p.Y * vh];
  outs.forEach((o, n) => {
    const sm = o && o.sm; if (!sm) return;
    octx.lineWidth = 4; octx.lineCap = 'round'; octx.strokeStyle = PCOL[n];
    for (const [a, b] of BONES) {
      if (sm[a].v < 0.4 || sm[b].v < 0.4) continue;
      const [x1,y1] = px(sm[a]), [x2,y2] = px(sm[b]);
      octx.beginPath(); octx.moveTo(x1,y1); octx.lineTo(x2,y2); octx.stroke();
    }
    if (S.players > 1) { const [hx, hy] = px(sm[P.NOSE]); octx.fillStyle = PCOL[n]; octx.font = 'bold 22px system-ui'; octx.textAlign = 'center'; octx.fillText('P' + (n + 1), hx, hy - 24); }
    for (const i of [P.LIDX, P.RIDX]) {
      if (sm[i].v < 0.3) continue;
      const [x,y] = px(sm[i]);
      octx.fillStyle = i === P.LIDX ? '#29e3ff' : '#ff4fd8';
      octx.beginPath(); octx.arc(x, y, 10, 0, Math.PI*2); octx.fill();
    }
    const B = PL[n].base;
    if (B) {
      const cx = ox + (B.hipX / aspect) * vw;
      octx.strokeStyle = 'rgba(255,255,255,0.35)'; octx.setLineDash([8,8]); octx.lineWidth = 2;
      octx.beginPath(); octx.moveTo(cx, oy); octx.lineTo(cx, oy + vh); octx.stroke(); octx.setLineDash([]);
    }
  });
}

function stats(now){
  const g = Q.g;
  $('#sLane').textContent = g.lane === -1 ? 'left' : g.lane === 1 ? 'right' : 'mid';
  $('#sJump').classList.toggle('on', g.jump);
  $('#sDuck').classList.toggle('on', g.duck);
  $('#sUp').classList.toggle('on', g.up);
  if (now - S.lastStat < 1000) return;
  $('#fps').textContent = Math.round(S.frames / ((now - S.lastStat) / 1000));
  S.frames = 0; S.lastStat = now;
  if (S.players > 1) $('#calState').textContent = `2-player · model for ${S.lmPlayers || 1} · sees ${S.seen | 0} ${S.seen === 1 ? 'person' : 'people'}`;
}
</script>
